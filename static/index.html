<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Interview Agent</title>

  <style>
    body { background:#343541; color:white; font-family:Arial; }
    #chat { max-width:800px; margin:auto; padding:20px; }
    .msg { padding:10px; margin:10px 0; border-radius:8px; }
    .user { background:#444654; }
    .bot { background:#202123; }
    input { width:70%; padding:10px; }
    button { padding:10px; }
  </style>
</head>

<body>
<div id="chat">
  <h2>Interview Voice Agent</h2>

  <div id="messages"></div>

	  <input id="input" placeholder="Type or speak..." />
	  <button onclick="send()">Send</button>
	  <button id="voiceBtn" onclick="toggleVoice()">🎤 Voice</button>
	  <button id="ttsBtn" onclick="toggleTTS()">🔇 静音</button>
	</div>

	<script>
	let sessionId = null;
	let isListening = false;
	let ttsEnabled = false; // default: off (no spoken output)
	let mediaStream = null;
	let mediaRecorder = null;
	let audioChunks = [];

	// =========================
	// 🔊 语音提示（新增）
	function speak(text) {
	    if (!ttsEnabled) return;
	    const msg = new SpeechSynthesisUtterance(text);
	    msg.lang = "en-US";
	    speechSynthesis.speak(msg);
	}

	// =========================
	// 初始化 session
	async function init() {
    const res = await fetch("/new-session");
    const data = await res.json();
    sessionId = data.session_id;
	}
	init();

	// =========================
	async function send() {
	    const input = document.getElementById("input");
	    const text = input.value;
	    if (!text) return;

    addMessage(text, "user");

    const res = await fetch("/chat/stream", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            session_id: sessionId,
            message: text
        })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    let botDiv = addMessage("", "bot");

    while (true) {
        const {value, done} = await reader.read();
        if (done) break;

        botDiv.innerText += decoder.decode(value);
    }

    input.value = "";

	    // 🔊 自动读结果（可选）
	    speak(botDiv.innerText.substring(0, 80));
	}

	// =========================
	function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
	    return div;
	}

	// =========================
	function toggleTTS() {
	    ttsEnabled = !ttsEnabled;
	    if (!ttsEnabled && window.speechSynthesis) {
	        // Stop any ongoing speech immediately when muting.
	        speechSynthesis.cancel();
	    }
	    document.getElementById("ttsBtn").innerText = ttsEnabled ? "🔊 朗读" : "🔇 静音";
	}

	// =========================
	function toggleVoice() {
	    if (!isListening) {
	        startRecording();
	    } else {
	        stopRecording();
	    }
	}

	async function startRecording() {
	    if (!navigator.mediaDevices?.getUserMedia) {
	        alert("Browser not supported");
	        return;
	    }
	    isListening = true;
	    document.getElementById("voiceBtn").innerText = "🛑 Stop";
	    speak("开始说话");

	    audioChunks = [];
	    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

	    // Try to prefer webm/opus (widely supported in Chromium). Safari may fall back.
	    const opts = {};
	    if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
	        opts.mimeType = "audio/webm;codecs=opus";
	    }
	    mediaRecorder = new MediaRecorder(mediaStream, opts);

	    mediaRecorder.ondataavailable = (e) => {
	        if (e.data && e.data.size > 0) audioChunks.push(e.data);
	    };

	    mediaRecorder.onstop = async () => {
	        try {
	            const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
	            const fd = new FormData();
	            fd.append("audio", blob, "audio.webm");
	            const res = await fetch("/transcribe", { method: "POST", body: fd });
	            const data = await res.json();
	            if (data?.text) {
	                document.getElementById("input").value = data.text.trim();
	                speak("识别结束");
	                // Auto-send when we got something usable.
	                if (document.getElementById("input").value.trim()) {
	                    send();
	                }
	            } else {
	                alert("Transcription failed");
	            }
	        } catch (err) {
	            console.error(err);
	            alert("Transcription error");
	        } finally {
	            // Release mic.
	            if (mediaStream) {
	                mediaStream.getTracks().forEach((t) => t.stop());
	            }
	            mediaStream = null;
	            mediaRecorder = null;
	            audioChunks = [];
	        }
	    };

	    mediaRecorder.start();
	}

	function stopRecording() {
	    isListening = false;
	    document.getElementById("voiceBtn").innerText = "🎤 Voice";
	    if (mediaRecorder && mediaRecorder.state !== "inactive") {
	        mediaRecorder.stop();
	    } else {
	        // If we never started properly, still release mic.
	        if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
	        mediaStream = null;
	        mediaRecorder = null;
	        audioChunks = [];
	    }
	}
	</script>
	</body>
	</html>
