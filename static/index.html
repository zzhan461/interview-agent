<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Interview Agent</title>

  <style>
    body { background:#343541; color:white; font-family:Arial; }
    #chat { max-width:800px; margin:auto; padding:20px; }
    .msg { padding:10px; margin:10px 0; border-radius:8px; }
    .user { background:#444654; }
    .bot { background:#202123; }
    input { width:70%; padding:10px; }
    button { padding:10px; }
  </style>
</head>

<body>
<div id="chat">
  <h2>Interview Voice Agent</h2>

  <div id="messages"></div>

  <input id="input" placeholder="Type or speak..." />
  <button onclick="send()">Send</button>
  <button id="voiceBtn" onclick="toggleVoice()">🎤 Voice</button>
</div>

<script>
let sessionId = null;
let recognition = null;
let isListening = false;

// =========================
// 🔊 语音提示（新增）
function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "zh-CN";
    speechSynthesis.speak(msg);
}

// =========================
// 初始化 session
async function init() {
    const res = await fetch("/new-session");
    const data = await res.json();
    sessionId = data.session_id;
}
init();

// =========================
async function send() {
    const input = document.getElementById("input");
    const text = input.value;
    if (!text) return;

    addMessage(text, "user");

    const res = await fetch("/chat/stream", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            session_id: sessionId,
            message: text
        })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    let botDiv = addMessage("", "bot");

    while (true) {
        const {value, done} = await reader.read();
        if (done) break;

        botDiv.innerText += decoder.decode(value);
    }

    input.value = "";

    // 🔊 自动读结果（可选）
    speak(botDiv.innerText.substring(0, 80));
}

// =========================
function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
    return div;
}

// =========================
// 🎤 语音识别（强化版）
function setupRecognition() {
    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    if (!SpeechRecognition) {
        alert("Browser not supported");
        return null;
    }

    const recog = new SpeechRecognition();

    recog.lang = "zh-CN";   // 🔥 中文核心
    recog.continuous = true;
    recog.interimResults = true;

    let finalText = "";

    recog.onstart = () => {
        speak("开始说话");
    };

    recog.onresult = (event) => {
        let interim = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            const t = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalText += t;
            } else {
                interim += t;
            }
        }

        document.getElementById("input").value = finalText + interim;
    };

    recog.onend = () => {
        if (isListening) {
            recog.start();
        } else {
            speak("识别结束");

            setTimeout(() => {
                if (document.getElementById("input").value.trim()) {
                    send();
                }
            }, 300);
        }
    };

    return recog;
}

// =========================
function toggleVoice() {
    if (!recognition) {
        recognition = setupRecognition();
    }

    if (!isListening) {
        isListening = true;
        recognition.start();
        document.getElementById("voiceBtn").innerText = "🛑 Stop";
    } else {
        isListening = false;
        recognition.stop();
        document.getElementById("voiceBtn").innerText = "🎤 Voice";
    }
}
</script>
</body>
</html>
